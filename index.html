<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hanse-Kontor</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23c8a24a'/%3E%3Cpath d='M8 22h16l-2 4H10zM16 6v14M16 8l7 6h-7z' stroke='%23402a10' stroke-width='2' fill='%23402a10'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="title-screen" class="overlay"></div>
  <div id="game" hidden>
    <header id="hud">
      <div class="hud-left"><span class="logo" data-i18n="title">Hanse-Kontor</span><span id="hud-date" class="hud-date"></span><span id="hud-time" class="hud-time"></span></div>
      <div class="hud-stats">
        <span id="hud-money" class="hud-money"></span>
        <span class="stat" data-i18n-title="rep">☆ <b id="hud-rep"></b></span>
        <span class="stat" data-i18n-title="influence">♜ <b id="hud-influence"></b></span>
        <span class="stat" data-i18n-title="piety">✝ <b id="hud-piety"></b></span>
        <span class="stat susp" data-i18n-title="suspicion">👁 <b id="hud-suspicion"></b></span>
        <span id="hud-rank" class="hud-rank"></span>
      </div>
      <div class="hud-right">
        <div class="speed">
          <button id="btn-pause" data-i18n-title="pause">⏸</button><button id="btn-s1" data-i18n-title="speed1">▶</button><button id="btn-s2" data-i18n-title="speed2">▶▶</button><button id="btn-s3" data-i18n-title="speed3">▶▶▶</button><button id="btn-step" data-i18n-title="stepDay">+1</button>
        </div>
        <div class="menu">
          <button id="btn-save" data-i18n="save">Speichern</button><button id="btn-export" data-i18n="exportSave">Exportieren</button><button id="btn-import" data-i18n="importSave">Importieren</button>
          <input type="file" id="file-import" accept="application/json,.json" hidden>
          <button id="btn-help" data-i18n="help">Hilfe</button><button id="btn-menu">☰</button>
          <span class="lang-switch"><button class="lang-btn" data-lang="de">DE</button><button class="lang-btn" data-lang="en">EN</button></span>
        </div>
      </div>
    </header>
    <main id="main">
      <div id="scene-wrap">
        <canvas id="scene" width="1280" height="800"></canvas>
        <div id="tooltip" hidden></div>
        <div id="scene-hint" class="legend" data-i18n="legend">Klicke auf Gebäude, Schiffe, Karawanen und Passanten.</div>
        <div id="zoom-ctl"><button type="button" data-zoom="in" title="+">+</button><button type="button" data-zoom="out" title="−">−</button><button type="button" data-zoom="reset" title="0">⌂</button></div>
      </div>
      <aside id="side">
        <nav id="tabs">
          <button data-tab="place" class="active"><span id="tab-place-label">…</span></button>
          <button data-tab="overview" data-i18n="tabOverview">Übersicht</button>
          <button data-tab="log"><span data-i18n="tabLog">Chronik</span> <span id="log-badge" class="badge" hidden></span></button>
        </nav>
        <div id="sidebar"></div>
      </aside>
    </main>
  </div>
  <div id="toasts"></div>
  <div id="modal" class="overlay" hidden></div>
  <script src="js/data.js"></script>
  <script src="js/iso.js"></script>
  <script src="js/town.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/game.js"></script>
  <script src="js/paths.js"></script>
  <script src="js/rivals.js"></script>
  <script src="js/contracts.js"></script>
  <script src="js/chains.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/buildings.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
